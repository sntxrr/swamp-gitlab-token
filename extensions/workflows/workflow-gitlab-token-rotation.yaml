# Required, and its absence is silent. A workflow file without an `id` is not
# rejected at load — the extension workflow repository logs one "Skipping broken
# extension workflow" warning and drops it, so `swamp workflow list` omits it
# entirely and `swamp workflow run` answers "Workflow not found", naming a
# workflow that is sitting right there in the repo.
# The extension still packages, publishes and scores 100%, because the manifest
# only records that a workflow file exists, not that it parses. That is how
# 2026.08.19.2 shipped a rotation workflow that could never be run.
#
# The id is fixed rather than generated per install: it identifies THIS
# workflow the way the name does, and run history attaches to the workflow
# (`swamp workflow delete` removes "a workflow and its run history"), so an id
# that changed on every pull would fragment that history across installs.
id: ec6eda6a-da94-4f00-8671-349695c7ebc7
name: "@sntxrr/gitlab-token-rotation"
description: >-
  Keep one GitLab access token ahead of its own expiry: check what it has left
  every day, and rotate it only when a human has said to and it is actually
  close to lapsing.

  The default posture is deliberate. `rotate` defaults to FALSE, so the
  scheduled run is a read-only check that keeps the token's `daysRemaining`
  current and does nothing else. Rotation is irreversible the instant it lands
  — GitLab revokes the outgoing value immediately, and replaying it trips reuse
  detection which revokes the whole token family — so an unattended schedule
  that could rotate on its own would be a way to take a consumer offline at
  06:40 with nobody watching. Turn it on deliberately:

      swamp workflow run @sntxrr/gitlab-token-rotation --input rotate=true

  The threshold is a second, independent gate. Even with `rotate=true` the
  rotate step is skipped unless the token is inside `rotateWithinDays`, so
  re-running the workflow by hand does not mint a new token every time it is
  invoked. Both conditions are evaluated in the model's `when` argument rather
  than a step condition, because swamp step conditions are status-based and
  cannot express a predicate over another step's output.

  The new value is disclosed exactly once. It lands in the model's `secret`
  resource, whose field is marked sensitive, so swamp stores it in a vault and
  persists only a reference. Wire the consumer to it before enabling rotation —
  a rotation whose output nothing reads is an outage you scheduled.

  Model instance: one per token, as the type intends. Point it at the token with
  `tokenName`, or the literal `self` in `tokenId` to manage the token doing the
  authenticating.

  Use `tokenName`, not `tokenId`, for anything this workflow will actually
  rotate. GitLab's rotate revokes the outgoing token and issues its replacement
  under a NEW id, so a configured `tokenId` names the revoked predecessor from
  the second run onward — the schedule would authenticate fine and then operate
  on a dead token every day thereafter. The name survives rotation; the id does
  not. `tokenId` remains right for pinning one specific generation, which is not
  what a rotation schedule wants.
tags: {}
# Daily. The CHECK wants to be frequent — an expiry that is only noticed weekly
# can already be a week into an outage — while the ROTATION is gated on a
# threshold, so a daily cadence produces at most one rotation per token per
# lifetime rather than one per run. Off the hour to avoid colliding with
# whatever else a host runs at :00.
trigger:
  schedule: "40 6 * * *"
inputs:
  properties:
    rotate:
      type: boolean
      description: >-
        Permit rotation. FALSE by default, which makes the scheduled run
        read-only. Rotation revokes the outgoing token immediately and
        cannot be undone, so this is opt-in per run.
      default: false
    rotateWithinDays:
      type: integer
      description: >-
        Rotate only when the token has this many days or fewer remaining.
        Independent of `rotate`: both must hold. Keeps a hand-run from
        minting a fresh token every time it is invoked.
      default: 7
    expiresAt:
      type: string
      description: >-
        Expiry for the replacement token, as YYYY-MM-DD. Leave empty to take
        GitLab's default, which is one week where an expiry is mandatory and
        the instance maximum otherwise.
      default: ""
    ciVariableProject:
      type: string
      description: >-
        Project owning the CI/CD variable that consumes this token, as a path
        (group/repo) or numeric ID. Leave empty to skip propagation entirely —
        appropriate when the consumer is something other than a GitLab CI
        variable. Note this is usually NOT the project that owns the token.
      default: ""
    ciVariableKey:
      type: string
      description: >-
        Name of the CI/CD variable to update with the rotated value, e.g.
        GITLAB_PUSH_TOKEN. Empty skips propagation. The variable must already
        exist — the model updates, it does not create.
      default: ""
  required: []
jobs:
  - name: check
    description: Read the managed token's current expiry
    steps:
      - name: sync-token
        description: >-
          Read-only. Writes a `token` snapshot carrying `daysRemaining` twice:
          keyed by the token's real GitLab ID for the audit trail, and under the
          stable alias `managed`, which the rotate step below reads back.

          This is also where `tokenName` earns its keep. If the instance is
          configured by name rather than by ID, this step resolves it to the
          live ID first — so the run after a rotation addresses the NEW token
          rather than the revoked one it replaced.
        task:
          type: model_method
          modelIdOrName: gitlab-token
          methodName: sync
        dependsOn: []
        weight: 0
        # NOT allowFailure. If the check cannot run, the token's remaining life
        # is UNKNOWN rather than known-good, and a rotation decision must never
        # be taken against a stale snapshot.
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: rotate
    description: Rotate, but only when told to and only when close to expiry
    steps:
      - name: rotate-token
        description: >-
          Gated on BOTH `inputs.rotate` and the days-remaining threshold, in the
          model's own `when` argument. A false predicate costs nothing: the
          model returns before it touches the API and writes no resource, so the
          existing snapshot stays true rather than gaining a generation that was
          never issued.

          The threshold reads the `managed` alias, NOT `findBySpec`. This model
          keys each snapshot by the token's real GitLab ID so a retired
          generation is never overwritten, which means `findBySpec` returns
          EVERY generation — including the one that was just rotated away, still
          sitting at zero days remaining. An `exists` over that stays true
          forever once any token has neared expiry, so a workflow gated on it
          would rotate again on every subsequent run and burn the token family.
          `managed` holds only the generation in play, so the predicate goes
          false as soon as a fresh token is issued.

          `.orValue` covers two honest gaps: a token with no expiry reports a
          null `daysRemaining`, and before the first sync there is no snapshot
          at all. Both default to a number far outside any threshold, so the
          absence of evidence never reads as due-for-rotation.
        task:
          type: model_method
          modelIdOrName: gitlab-token
          methodName: rotate
          inputs:
            expiresAt: ${{ inputs.expiresAt }}
            when: >-
              ${{ inputs.rotate &&
              data.latest('gitlab-token', 'managed').?attributes.?daysRemaining.orValue(99999)
              <= inputs.rotateWithinDays }}
        dependsOn: []
        weight: 0
        # NOT allowFailure. A rotation that half-happened is the one outcome
        # worth failing the run over: the outgoing token may already be revoked,
        # so silence here would report success over a live outage.
        allowFailure: false
    dependsOn:
      - job: check
        condition:
          type: succeeded
    weight: 1
  - name: propagate
    description: Carry the rotated value through to the consumer that reads it
    steps:
      - name: update-ci-variable
        description: >-
          The step that turns a rotation into a completed handover rather than
          an outage. GitLab discloses a token value exactly once; if nothing
          writes it to the consumer, the previous value is already revoked and
          the pipeline that depended on it fails on its next run.

          Reads the value from the `current` alias, NOT from a snapshot keyed by
          token ID. Rotation mints a new ID every time, so an ID-keyed instance
          cannot be named in a file written beforehand, and `findBySpec` returns
          every generation with no way in CEL to ask for the newest — a consumer
          picking wrong would write a REVOKED value over a live one. `current`
          is always the value issued most recently.

          Gated on the same two conditions as the rotate step plus a configured
          target, so a run that rotated nothing writes nothing. The model
          re-asserts `masked` and `protected` on every write, because GitLab
          does not inherit them and silently unmasking a secret in a public
          project's job log is the worse failure of the two.
        task:
          type: model_method
          modelIdOrName: gitlab-token
          methodName: update-ci-variable
          inputs:
            project: ${{ inputs.ciVariableProject }}
            key: ${{ inputs.ciVariableKey }}
            value: >-
              ${{ data.latest('gitlab-token', 'current').attributes.token }}
            tokenId: >-
              ${{ data.latest('gitlab-token', 'current').attributes.tokenId }}
            when: >-
              ${{ inputs.rotate && inputs.ciVariableKey != '' &&
              inputs.ciVariableProject != '' &&
              data.latest('gitlab-token', 'managed').?attributes.?daysRemaining.orValue(99999)
              <= inputs.rotateWithinDays }}
        dependsOn: []
        weight: 0
        # NOT allowFailure, and this is the most important allowFailure decision
        # in the file. The outgoing token is already revoked by the time this
        # step runs. Swallowing a failure here would report a green run over a
        # consumer that is now holding a dead credential — the exact silent
        # outage the whole workflow exists to prevent.
        allowFailure: false
    dependsOn:
      - job: rotate
        condition:
          type: succeeded
    weight: 2
